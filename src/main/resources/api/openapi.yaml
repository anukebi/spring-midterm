openapi: 3.0.3
info:
  title: Midterm API
  version: 1.0.0

paths:
  /api/app-info:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags:
        - AppInfo
      summary: Application metadata (localized welcome message)
      operationId: getAppInfo
      responses:
        '200':
          $ref: '#/components/responses/AppInfoResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/companies:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags:
        - Company
      summary: Get all companies
      operationId: getCompanies
      x-spring-paginated: true
      responses:
        '200':
          $ref: '#/components/responses/CompanyListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Company
      summary: Create a company
      operationId: saveCompany
      requestBody:
        $ref: '#/components/requestBodies/CompanyPayload'
      responses:
        '201':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/companies/{id}:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdPath'
    get:
      tags:
        - Company
      summary: Get company by ID
      operationId: getCompany
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Company
      summary: Update a company
      operationId: updateCompany
      requestBody:
        $ref: '#/components/requestBodies/CompanyPayload'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Company
      summary: Delete a company
      operationId: deleteCompany
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/employees:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags:
        - Employee
      summary: Get all employees
      operationId: getEmployees
      x-spring-paginated: true
      responses:
        '200':
          $ref: '#/components/responses/EmployeeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Employee
      summary: Create an employee
      operationId: saveEmployee
      requestBody:
        $ref: '#/components/requestBodies/EmployeePayload'
      responses:
        '201':
          $ref: '#/components/responses/EmployeeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdPath'
    get:
      tags:
        - Employee
      summary: Get employee by ID
      operationId: getEmployee
      responses:
        '200':
          $ref: '#/components/responses/EmployeeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Employee
      summary: Update an employee
      operationId: updateEmployee
      requestBody:
        $ref: '#/components/requestBodies/EmployeePayload'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Employee
      summary: Delete an employee
      operationId: deleteEmployee
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/profiles:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags:
        - Profile
      summary: Get all profiles (ADMIN, enforced by @PreAuthorize)
      operationId: getProfiles
      x-spring-paginated: true
      responses:
        '200':
          $ref: '#/components/responses/ProfileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdPath'
    get:
      tags:
        - Profile
      summary: Get profile by ID (ADMIN, enforced by @PreAuthorize)
      operationId: getProfile
      responses:
        '200':
          $ref: '#/components/responses/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      schema:
        type: string
      description: Preferred language for localized messages (`en`, `ka`)
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    AppInfoDto:
      $ref: './schemas/app-info-dto.yaml'
    CompanyDto:
      $ref: './schemas/company-dto.yaml'
    ProfileDto:
      $ref: './schemas/profile-dto.yaml'
    EmployeeDto:
      $ref: './schemas/employee-dto.yaml'
    ErrorResponse:
      $ref: './schemas/errors.yaml#/components/schemas/ErrorResponse'
    ValidationErrorResponse:
      $ref: './schemas/errors.yaml#/components/schemas/ValidationErrorResponse'

  examples:
    AppInfoDtoExample:
      externalValue: './examples/app-info-sample.json'
    CompanyPayloadExample:
      externalValue: './examples/company-create-sample.json'
    CompanyDtoExample:
      externalValue: './examples/company-sample.json'
    CompanyDtoListExample:
      externalValue: './examples/company-list-sample.json'
    EmployeePayloadExample:
      externalValue: './examples/employee-create-sample.json'
    EmployeeDtoExample:
      externalValue: './examples/employee-sample.json'
    EmployeeDtoListExample:
      externalValue: './examples/employee-list-sample.json'
    ProfileDtoExample:
      externalValue: './examples/profile-sample.json'
    ProfileDtoListExample:
      externalValue: './examples/profile-list-sample.json'

  requestBodies:
    CompanyPayload:
      required: true
      description: Company request body (create or update)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyDto'
          examples:
            sample:
              $ref: '#/components/examples/CompanyPayloadExample'
    EmployeePayload:
      required: true
      description: Employee request body (create or update)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmployeeDto'
          examples:
            sample:
              $ref: '#/components/examples/EmployeePayloadExample'

  responses:
    AppInfoResponse:
      description: Application metadata retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppInfoDto'
          examples:
            sample:
              $ref: '#/components/examples/AppInfoDtoExample'

    CompanyResponse:
      description: Company retrieved or created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyDto'
          examples:
            sample:
              $ref: '#/components/examples/CompanyDtoExample'

    CompanyListResponse:
      description: Companies retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CompanyDto'
          examples:
            sample:
              $ref: '#/components/examples/CompanyDtoListExample'

    EmployeeResponse:
      description: Employee retrieved or created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmployeeDto'
          examples:
            sample:
              $ref: '#/components/examples/EmployeeDtoExample'

    EmployeeListResponse:
      description: Employees retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EmployeeDto'
          examples:
            sample:
              $ref: '#/components/examples/EmployeeDtoListExample'

    ProfileResponse:
      description: Profile retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileDto'
          examples:
            sample:
              $ref: '#/components/examples/ProfileDtoExample'

    ProfileListResponse:
      description: Profiles retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProfileDto'
          examples:
            sample:
              $ref: '#/components/examples/ProfileDtoListExample'

    NoContent:
      description: Operation completed successfully (no response body)

    BadRequest:
      $ref: './schemas/errors.yaml#/components/responses/BadRequest'

    Unauthorized:
      $ref: './schemas/errors.yaml#/components/responses/Unauthorized'

    Forbidden:
      $ref: './schemas/errors.yaml#/components/responses/Forbidden'

    NotFound:
      $ref: './schemas/errors.yaml#/components/responses/NotFound'

    InternalServerError:
      $ref: './schemas/errors.yaml#/components/responses/InternalServerError'

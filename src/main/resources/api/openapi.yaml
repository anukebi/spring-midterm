openapi: 3.0.3
info:
  title: Midterm API
  version: 1.0.0

paths:
  /api/app-info:
    parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
    get:
      tags:
        - AppInfo
      summary: Application metadata (localized welcome message)
      operationId: getAppInfo
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfoDto'
  /api/companies:
    parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
    get:
      tags:
        - Company
      summary: Get all companies
      operationId: getCompanies
      x-spring-paginated: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyDto'
    post:
      tags:
        - Company
      summary: Create a company
      operationId: saveCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDto'
  /api/companies/{id}:
    parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Company
      summary: Get company by ID
      operationId: getCompany
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDto'
        '404':
          description: Not found
    put:
      tags:
        - Company
      summary: Update a company
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDto'
      responses:
        '204':
          description: Updated
        '404':
          description: Not found
    delete:
      tags:
        - Company
      summary: Delete a company
      operationId: deleteCompany
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found


  /api/employees:
    parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
    get:
      tags:
        - Employee
      summary: Get all employees
      operationId: getEmployees
      x-spring-paginated: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeDto'
    post:
      tags:
        - Employee
      summary: Create an employee
      operationId: saveEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
  /api/employees/{id}:
    parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Employee
      summary: Get employee by ID
      operationId: getEmployee
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
        '404':
          description: Not found
    put:
      tags:
        - Employee
      summary: Update an employee
      operationId: updateEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDto'
      responses:
        '204':
          description: Updated
        '404':
          description: Not found
    delete:
      tags:
        - Employee
      summary: Delete an employee
      operationId: deleteEmployee
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /api/profiles:
    parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
    get:
      tags:
        - Profile
      summary: Get all profiles (ADMIN, enforced by @PreAuthorize)
      operationId: getProfiles
      x-spring-paginated: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileDto'
        '401':
          description: Unauthorized
  /api/profiles/{id}:
    parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Profile
      summary: Get profile by ID (ADMIN, enforced by @PreAuthorize)
      operationId: getProfile
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '401':
          description: Unauthorized
        '404':
          description: Not found


components:
  schemas:
    AppInfoDto:
      type: object
      properties:
        title:
          type: string
        contactEmail:
          type: string
        paginationLimit:
          type: integer
          format: int32
        externalServiceUrl:
          type: string
        welcomeMessage:
          type: string
    CompanyDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          x-field-extra-annotation: |-
            @jakarta.validation.constraints.NotBlank(message = "{validation.company.name.required}")
            @jakarta.validation.constraints.Size(min = 2, max = 100, message = "{validation.company.name.size}")
      required:
        - name
    ProfileDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bio:
          type: string
        phoneNumber:
          type: string
    EmployeeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
          x-field-extra-annotation: |-
            @jakarta.validation.constraints.NotBlank(message = "{validation.employee.firstName.required}")
            @jakarta.validation.constraints.Size(min = 2, max = 50, message = "{validation.employee.firstName.size}")
        lastName:
          type: string
          x-field-extra-annotation: |-
            @jakarta.validation.constraints.NotBlank(message = "{validation.employee.lastName.required}")
            @jakarta.validation.constraints.Size(min = 2, max = 50, message = "{validation.employee.lastName.size}")
        email:
          type: string
          x-field-extra-annotation: |-
            @jakarta.validation.constraints.NotBlank(message = "{validation.employee.email.required}")
            @jakarta.validation.constraints.Email(message = "{validation.employee.email.invalid}")
        companyId:
          type: integer
          format: int64
        profile:
          $ref: '#/components/schemas/ProfileDto'
      required:
        - firstName
        - lastName
        - email

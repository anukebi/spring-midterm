spring:
  application:
    name: midterm
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  messages:
    basename: messages
    encoding: UTF-8

springdoc:
  swagger-ui:
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    java:
      enabled: true
    env:
      enabled: true

app:
  settings:
    title: Midterm API
    pagination-limit: 50
    contact-email: dev@localhost
    external-service-url: http://localhost:8080
  credentials:
    admin-password: ${ADMIN_PASSWORD:admin123}
    user-password: ${USER_PASSWORD:user123}

logging:
  file:
    name: logs/app.log

spring:
  datasource:
    url: jdbc:h2:mem:midterm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

app:
  settings:
    pagination-limit: 50
    contact-email: dev@localhost
    external-service-url: http://localhost:8080

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.edu.kiu.midterm: DEBUG
